<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Osman Nuri Yaşar</title>
    <meta name="description" content="Osman Nuri Yaşar'ın yazıları, raporları ve notları: mobil geliştirme, siber güvenlik ve yapay zekâ üzerine.">
    <link rel="canonical" href="https://osmnnuri.github.io/blog/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">
    <meta property="og:title" content="Blog | Osman Nuri Yaşar">
    <meta property="og:description" content="Yazılar, raporlar ve notlar: mobil geliştirme, siber güvenlik ve yapay zekâ.">
    <link rel="icon" type="image/png" href="../görseller/icons/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@1,9..144,300..700,100&family=Figtree:ital,wght@0,400..700;1,400..700&display=swap">
    <link rel="stylesheet" href="../style.css?v=12">
</head>
<body>
    <nav class="navbar">
        <div class="wrap">
            <a href="../" class="logo">ONY</a>
            <button class="hamburger" id="hamburger" aria-label="Menüyü Aç/Kapat" aria-expanded="false" aria-controls="navLinks">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../#projects">Projeler</a></li>
                <li><a href="../#about">Hakkımda</a></li>
                <li><a href="../#experience">Deneyim &amp; Eğitim</a></li>
                <li><a href="./" class="current">Blog</a></li>
                <li><a href="../#contact" class="nav-btn">İletişim</a></li>
            </ul>
        </div>
    </nav>
    <div class="nav-overlay" id="navOverlay"></div>

    <main>
        <header class="blog-hero">
            <div class="wrap">
                <p class="eyebrow">Blog</p>
                <h1>Yazılar ve raporlar</h1>
                <p>Projelerimden notlar, öğrendiklerim ve hazırladığım raporlar. Mobil geliştirme, siber güvenlik ve yapay zekâ üzerine.</p>
            </div>
        </header>

        <section class="blog-list">
            <div class="wrap">
                <div class="blog-toolbar">
                    <div class="filters" role="group" aria-label="Türe göre filtrele" id="kindFilters">
                        <button type="button" data-kind="all" aria-pressed="true">Tümü</button>
                        <button type="button" data-kind="yazi" aria-pressed="false">Yazılar</button>
                        <button type="button" data-kind="rapor" aria-pressed="false">Raporlar</button>
                        <button type="button" data-kind="not" aria-pressed="false">Notlar</button>
                    </div>
                    <input type="search" class="blog-search" id="blogSearch" placeholder="Yazılarda ara..." aria-label="Yazılarda ara">
                </div>
                <div class="post-grid" id="postList" aria-live="polite"></div>
                <p class="blog-empty" id="postEmpty" hidden>Yükleniyor...</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="wrap">
            <span>© 2026 Osman Nuri Yaşar</span>
            <nav class="footer-links" aria-label="Sosyal bağlantılar">
                <a href="https://github.com/osmnnuri" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/osman-nuri-yaşar-59901a324/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="mailto:osmannuriyasar57@gmail.com">E-posta</a>
                <a href="../">Ana sayfa</a>
            </nav>
        </div>
    </footer>

    <script src="../javascript/supabase-config.js?v=1"></script>
    <script src="../javascript/blog.js?v=1"></script>
</body>
</html>
